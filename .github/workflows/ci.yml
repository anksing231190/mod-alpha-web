name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: modalpha_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/modalpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: find web/src -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: node scripts/build-web.mjs stage && node scripts/build-web.mjs prod
  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t mod-alpha-api:ci .
      - run: docker build -f web/Dockerfile --build-arg APP_ENV=stage -t mod-alpha-web:ci .
