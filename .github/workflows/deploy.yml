# Stage deploys on every push to main; prod deploys when a release tag (v*) is pushed and
# the "prod" GitHub Environment approval passes. Configure per-environment secrets/vars in
# GitHub → Settings → Environments (stage, prod).
name: Deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [stage, prod], default: stage }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'stage') }}
    permissions: { contents: read, packages: write }
    env:
      APP_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'stage') }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build & push API image
        run: |
          docker build -f apps/api/Dockerfile -t $REGISTRY/mod-alpha-api:${{ github.sha }} -t $REGISTRY/mod-alpha-api:$APP_ENV .
          docker push --all-tags $REGISTRY/mod-alpha-api
      - name: Build & push web image
        run: |
          docker build -f apps/web/Dockerfile --build-arg APP_ENV=$APP_ENV \
            --build-arg WEB_API_BASE_URL="${{ vars.WEB_API_BASE_URL }}" \
            --build-arg WEB_RAZORPAY_KEY_ID="${{ vars.WEB_RAZORPAY_KEY_ID }}" \
            --build-arg WEB_GOOGLE_CLIENT_ID="${{ vars.WEB_GOOGLE_CLIENT_ID }}" \
            -t $REGISTRY/mod-alpha-web:${{ github.sha }} -t $REGISTRY/mod-alpha-web:$APP_ENV .
          docker push --all-tags $REGISTRY/mod-alpha-web
      - name: Roll out to the stage server (SSH)
        # Set these in GitHub → Settings → Environments → stage: variable STAGE_SSH_HOST (e.g. 13.233.x.x),
        # variable STAGE_SSH_USER (e.g. ubuntu), secret STAGE_SSH_KEY (private key of a deploy-only user).
        if: ${{ env.APP_ENV == 'stage' && vars.STAGE_SSH_HOST != '' }}
        run: |
          install -m 600 /dev/null key && echo "${{ secrets.STAGE_SSH_KEY }}" > key
          ssh -i key -o StrictHostKeyChecking=accept-new ${{ vars.STAGE_SSH_USER }}@${{ vars.STAGE_SSH_HOST }} "cd ~/modalpha-stage && ./deploy.sh ${{ github.sha }}"
          rm -f key
      - name: Roll out
        # Host-agnostic: call the platform's deploy hook (Render/Railway/Coolify/your CD) with the new image tag.
        # Runtime env vars (DATABASE_URL, JWT_SECRET, provider keys) live in the hosting platform's secret store.
        if: ${{ vars.DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ vars.DEPLOY_HOOK_URL }}" -H "Authorization: Bearer ${{ secrets.DEPLOY_HOOK_TOKEN }}" -d "{\"tag\":\"${{ github.sha }}\",\"env\":\"$APP_ENV\"}"
